name: CI

# Focused host CI: format, clippy, build, test. Runs on master.
#
# This is a mixed workspace: most crates are host-buildable libraries + host
# tools, but the userland apps and the bootloader are `no_std`/`#![no_main]`
# binaries for a custom bare-metal target — they cannot link for the host
# (their `_start` collides with the host crt0). So we lint everything (clippy
# type-checks bins without linking), but only *build* libraries + host tools
# and only *test* the host-runnable crates. The bare-metal images are built
# for their real target via `setup-dev.sh` / `testing/build.sh`.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fmt · clippy · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchain matches rust-toolchain.toml (1.97.1).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # build.rs in several crates assembles x86_64 `.s` files with NASM; the
      # foundation C-probe oracles need a host C compiler.
      - name: Install NASM + C toolchains (host C-probe oracles)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm gcc musl-tools

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude morpheus-bootloader --all-features --lib --bins -- -W warnings

      - name: Build (libraries)
        run: cargo build --workspace --lib --all-features

      - name: Test (host-runnable crates + oracles)
        run: |
          cargo test --all-features \
            -p morpheus-foundation \
            -p iso9660-rs \
            -p morpheus-storage-format \
            -p morpheus-helix \
            -p morpheus-block \
            -p morpheus-fat32 \
            -p morpheus-hal-x86_64 \
            -p morpheus-nic \
            -p morpheus-net-stack

      - name: Oracle-boundary guard (no oracle crate in shipped graph)
        run: |
          tree=$(cargo tree -e no-dev --target all 2>/dev/null)
          fail=0
          for c in libc proptest crc32fast; do
            if echo "$tree" | grep -qE "(^| )$c v[0-9]"; then
              echo "::error::$c leaked into the shipped (no-dev) dependency graph"; fail=1
            fi
          done
          exit $fail

  boot-smoke:
    name: uefi build · qemu boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-unknown-uefi

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install NASM + QEMU + OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm qemu-system-x86 ovmf mtools dosfstools

      - name: Build UEFI image (2-pass reloc embed)
        run: ./scripts/ci-build-uefi.sh --release

      # TCG (no KVM on hosted runners) — generous timeout. The kernel prints
      # MORPHEUSX_BOOT_OK once core bring-up (mem/smp/usb/storage probe) is done.
      - name: QEMU boot smoke
        run: ./scripts/qemu-e2e.sh target/x86_64-unknown-uefi/release/morpheus-bootloader.efi --timeout 240 --no-kvm
